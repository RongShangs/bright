<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">背屏控制 2.0 主面板与 LSP 二级页面</title>
  <desc id="desc">界面示意，非真机截图。右侧黄色背屏策略入口打开二级页，将 Root 永不息屏与 LSP AOD 策略分组展示。</desc>
  <defs>
    <linearGradient id="scene" x2="1" y2="1"><stop stop-color="#344456"/><stop offset="1" stop-color="#171b29"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#fcfcfc"/><stop offset="1" stop-color="#e8edf1"/></linearGradient>
    <linearGradient id="slider" x2="0" y2="1"><stop stop-color="#ffd374"/><stop offset="1" stop-color="#ffb52e"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".25"/></filter>
    <clipPath id="sliderClip"><rect x="284" y="256" width="96" height="250" rx="26"/></clipPath>
  </defs>
  <rect width="1200" height="900" fill="url(#scene)"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="54" y="82" fill="#fff" font-size="27" font-weight="700">原来的比例，熟悉的控制</text>
    <text x="54" y="117" fill="#c0cbd5" font-size="17">低频操作放进二级页面</text>
    <text x="54" y="214" fill="#c0cbd5" font-size="16">主面板</text>
    <rect x="54" y="234" width="510" height="294" rx="30" fill="url(#glass)" filter="url(#shadow)"/>
    <rect x="76" y="256" width="194" height="250" rx="22" fill="#667078" fill-opacity=".07"/>
    <text x="94" y="284" fill="#757c85" font-size="14">亮度状态</text>
    <text x="252" y="284" fill="#23885e" font-size="13" text-anchor="end">已接管</text>
    <g font-size="15" fill="#656a73"><text x="94" y="328">目标</text><text x="94" y="363">当前</text><text x="94" y="398">上限</text></g>
    <g font-size="20" font-weight="700" text-anchor="end"><text x="252" y="328" fill="#20252a">2940</text><text x="252" y="363" fill="#bd8000">2940</text><text x="252" y="398" fill="#555c64" font-size="17">4095</text></g>
    <text x="94" y="462" fill="#a16a00" font-size="14">发布页</text>
    <text x="94" y="491" fill="#656a73" font-size="14">酷安@戎Shangs</text>
    <rect x="284" y="256" width="96" height="250" rx="26" fill="#7f8587" fill-opacity=".12"/>
    <g clip-path="url(#sliderClip)"><rect x="284" y="330" width="96" height="176" fill="url(#slider)"/></g>
    <g transform="translate(332 469)" fill="none" stroke="#5b4314" stroke-width="3" stroke-linecap="round"><circle r="10" fill="#5b4314" stroke="none"/><path d="M0-21v-5M0 21v5M-21 0h-5M21 0h5M-15-15l-4-4M15 15l4 4M15-15l4-4M-15 15l-4 4"/></g>
    <rect x="394" y="256" width="148" height="78" rx="19" fill="#7f8587" fill-opacity=".1"/>
    <rect x="394" y="342" width="148" height="78" rx="19" fill="#ffb52e" fill-opacity=".2"/>
    <rect x="394" y="428" width="148" height="78" rx="19" fill="#23885e" fill-opacity=".08"/>
    <g font-size="16" font-weight="700" text-anchor="middle"><text x="468" y="290" fill="#20252a">AOD</text><text x="468" y="312" fill="#20252a">已开启</text><text x="468" y="376" fill="#9a6600">背屏</text><text x="468" y="398" fill="#9a6600">策略</text><text x="468" y="462" fill="#23885e">恢复</text><text x="468" y="484" fill="#23885e">系统控制</text></g>
    <path d="M584 381h36m-10-10 10 10-10 10" fill="none" stroke="#aebecb" stroke-width="2"/>
    <text x="650" y="157" fill="#c0cbd5" font-size="16">背屏策略 · 二级页面</text>
    <rect x="650" y="177" width="496" height="610" rx="30" fill="url(#glass)" filter="url(#shadow)"/>
    <text x="677" y="220" fill="#656a73" font-size="17">‹ 返回</text><text x="776" y="220" fill="#20252a" font-size="22" font-weight="700">背屏策略</text>
    <text x="677" y="269" fill="#656a73" font-size="14">ROOT · 活跃显示</text>
    <text x="677" y="314" fill="#aa3f2c" font-size="20">永不息屏</text>
    <text x="677" y="348" fill="#656a73" font-size="14">已关闭 · 跟随系统超时</text>
    <text x="677" y="377" fill="#656a73" font-size="14">持续检测并尝试唤醒背屏，保持活跃画面；无需 LSP。</text>
    <path d="M677 405h440" stroke="#d2d4d6"/>
    <text x="677" y="440" fill="#656a73" font-size="14">LSP · AOD 息屏策略</text>
    <text x="677" y="472" fill="#656a73" font-size="16">LSP 配置通道已连接</text>
    <text x="677" y="525" fill="#20252a" font-size="19">阻止暗光自动息屏</text><text x="677" y="558" fill="#656a73" font-size="14">当前固件的暗光延迟为 5 分钟。</text>
    <text x="677" y="615" fill="#20252a" font-size="19">阻止遮挡自动息屏</text><text x="677" y="648" fill="#656a73" font-size="14">仅针对背屏，不改变主屏通话感应。</text>
    <g fill="#c4c9cc"><rect x="1051" y="291" width="66" height="34" rx="17"/><rect x="1051" y="502" width="66" height="34" rx="17"/><rect x="1051" y="592" width="66" height="34" rx="17"/></g><g fill="#fff"><circle cx="1070" cy="308" r="14"/><circle cx="1070" cy="519" r="14"/><circle cx="1070" cy="609" r="14"/></g>
    <text x="677" y="710" fill="#977000" font-size="14">关闭省电策略会增加耗电与烧屏风险。</text><text x="677" y="755" fill="#656a73" font-size="16">启用方式与适配说明 ⓘ</text>
    <text x="600" y="855" fill="#bbc6d0" font-size="16" text-anchor="middle">v2.0.0 · 界面示意，非真机截图</text>
  </g>
</svg>
